<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Budget Tracker</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Styles -->
<link rel="stylesheet" href="css/styles.css">

<style>
/* View toggle styles */
.view-container {
    display: none;
}
.view-container.active {
    display: block;
}

/* Flyer upload styles */
.flyer-upload-section {
    margin: 1rem 0;
    padding: 1rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
}

.flyer-preview {
    margin-top: 1rem;
    text-align: center;
}

.flyer-preview img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    border: 1px solid var(--line);
}

.flyer-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
    justify-content: center;
}

.flyer-actions button {
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
}

</style>
</head>

<body>

<!-- Navigation Dropdown -->
<div class="nav-dropdown" id="navDropdown">
    <button class="nav-toggle" id="navToggle">
        Menu
    </button>
    <div class="nav-menu">
        <a href="https://www.xodiamediagroup.com/" target="_top" rel="noopener">Home</a>
        <a href="https://www.xodiamediagroup.com/upcoming-events" target="_top" rel="noopener">Upcoming Events</a>
        <a href="https://www.xodiamediagroup.com/contact" target="_top" rel="noopener">Contact Us</a>
        <a href="https://www.xodiamediagroup.com/tools" target="_top" rel="noopener">Tools</a>
    </div>
</div>

<div class="page-wrapper">

<!-- STANDARD BUDGET VIEW -->
<div id="standardView" class="view-container active">
    <h1 style="display: flex; align-items: center; justify-content: center; gap: 3rem;">
        Event Budget Tracker
        <img src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w" alt="Xodia Media Group Logo" style="height: 2.5rem; width: auto;">
    </h1>

    <div class="main-container">

    <!-- =========================
        LEFT COLUMN: SUMMARY + TEXT PREVIEW
    ========================== -->
    <aside class="preview-panel">

        <!-- SUMMARY -->
        <div id="summary">
            <div class="summary-title">SUMMARY</div>
            <p>Total Expenses: $<span id="totalExpenses">0</span></p>
            <p>Total Incoming Sales: $<span id="totalRevenue">0</span></p>
            <p id="profitLine">Net Profit: $<span id="netProfit">0</span></p>
            
            <div style="margin-top: 1.5rem;">
                <button type="button" id="toggleAnalyticsBtn" onclick="window.location.href='analytics.html'">
                    View All Events Analytics
                </button>
            </div>
        </div>

        <!-- SERVER LOAD SECTION -->
        <div class="server-load-section">
            <h3>Load/Save Budget</h3>
            
            <label for="budgetSelector">Select Budget:</label>
            <select id="budgetSelector" onchange="handleBudgetSelection(this.value)">
                <option value="">-- Choose a budget --</option>
            </select>
            
            <div class="load-save-row">
  <button type="button" class="danger" onclick="handleSaveBudgetToServer()">Save</button>
</div>
            
            <span id="loadStatus" class="load-status"></span>
        </div>

        <!-- TEXT BUDGET PREVIEW -->
        <div id="textPreview"></div>
        <div class="text-preview-actions">
            <button type="button" onclick="copyTextPreview()">Copy</button>
            <button type="button" onclick="exportTextPreviewTxt()">Export .txt</button>
            <span id="copyStatus" class="copy-status"></span>
        </div>
    </aside>


    <!-- =========================
        MIDDLE COLUMN: FORM
    ========================== -->
    <div class="form-panel">
        <form id="budgetForm" onsubmit="return false">
        <!-- TITLE & DATE -->
        <label>Show Title:</label>
        <input id="showTitle" type="text" oninput="updateBudget()">
        
        <!-- NEW: Venue Name Field -->
        <label>Venue Name:</label>
        <input id="venueName" type="text" oninput="updateBudget()">
        
        <label>Show Date:</label>
        <input id="showDate" type="date" oninput="updateBudget()">

        <!-- NEW: Flyer Upload Section -->
        <div class="flyer-upload-section">
            <label for="flyerUpload">Event Flyer:</label>
            <input id="flyerUpload" type="file" accept="image/*" onchange="handleFlyerPreview(this)">
            <div id="flyerPreview" class="flyer-preview" style="display: none;">
                <img id="flyerImage" src="" alt="Flyer preview">
                <div class="flyer-actions">
                    <button type="button" onclick="removeFlyerPreview()">Remove</button>
                    <button type="button" onclick="viewFlyerFullSize()">View Full Size</button>
                </div>
            </div>
        </div>

        <!-- -------------------------
            COLLAPSIBLE: HEADLINERS
        -------------------------- -->
        <div class="collapsible" id="col_headliners">
            <div class="collapsible-header" onclick="toggleCollapse('col_headliners')">
            <span class="arrow">▸</span> Headliners
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Headliners:</label>
                <input id="numHeadliners" type="number" min="0" max="10" value="0"
                    onchange="regenerateHeadliners()">
            </div>
            <div id="headlinerInputs"></div>
            </div>
        </div>

        <!-- -------------------------
            COLLAPSIBLE: SUPPORT
        -------------------------- -->
        <div class="collapsible" id="col_support">
            <div class="collapsible-header" onclick="toggleCollapse('col_support')">
            <span class="arrow">▸</span> Support
            </div>
            <div class="collapsible-content">
            <!-- Direct Support Card -->
            <div class="support-card">
                <h3>Direct Support</h3>
                <label>Name:</label>
                <input id="directSupportName" type="text" oninput="updateBudget()">
                <label>Fee:</label>
                <input id="directSupport" type="number" step="0.01" oninput="updateBudget()">
                <label>Hotel:</label>
                <input id="directSupportHotel" type="number" step="0.01" oninput="updateBudget()">
                <label>Rider:</label>
                <input id="directSupportRider" type="number" step="0.01" oninput="updateBudget()">
            </div>
            
            <div class="quantity-row">
                <label>Number of Local DJs:</label>
                <input id="numLocalDJs" type="number" min="0" max="20" value="0"
                    onchange="regenerateLocalDJs()">
            </div>
            <div id="localDJInputs"></div>
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: PRODUCTION
        -------------------------- -->
        <div class="collapsible" id="col_production">
            <div class="collapsible-header" onclick="toggleCollapse('col_production')">
            <span class="arrow">▸</span> Production
            </div>
            <div class="collapsible-content">
            <label>Venue Cost:</label>
            <input id="venue" type="number" step="0.01" oninput="updateBudget()">
            <label for="vjFee">VJ Fee</label>
            <input id="vjFee" type="number" step="0.01" value="0" oninput="updateBudget()">
            <label>LED Wall:</label>
            <input id="ledWall" type="number" step="0.01" oninput="updateBudget()">
            <label>Lights:</label>
            <input id="lights" type="number" step="0.01" oninput="updateBudget()">
            <label>Lasers:</label>
            <input id="lasers" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: GEAR
        -------------------------- -->
        <div class="collapsible" id="col_gear">
            <div class="collapsible-header" onclick="toggleCollapse('col_gear')">
            <span class="arrow">▸</span> Gear Rentals
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of CDJs:</label>
                <input id="numCDJs" type="number" min="0" max="10" value="0"
                    onchange="regenerateCDJs()">
            </div>
            <div id="cdjInputs"></div>
            <label>Mixer:</label>
            <input id="mixer" type="number" step="0.01" oninput="updateBudget()">
            <label>Sound:</label>
            <input id="sound" type="number" step="0.01" oninput="updateBudget()">
            <label>Table:</label>
            <input id="table" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: SHOW RUNNERS
        -------------------------- -->
        <div class="collapsible" id="col_showrunners">
            <div class="collapsible-header" onclick="toggleCollapse('col_showrunners')">
            <span class="arrow">▸</span> Show Runners
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Show Runners:</label>
                <input id="numShowRunners" type="number" min="0" max="10" value="0"
                    onchange="regenerateShowRunners()">
            </div>
            <div id="showRunnerInputs"></div>
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: MARKETING
        -------------------------- -->
        <div class="collapsible" id="col_marketing">
            <div class="collapsible-header" onclick="toggleCollapse('col_marketing')">
            <span class="arrow">▸</span> Marketing
            </div>
            <div class="collapsible-content">
            <label>Facebook Ads (XODIA):</label>
            <input id="facebookAdsXodia" type="number" step="0.01" oninput="updateBudget()">
            <label>Facebook Ads (SPACE CAMP HQ):</label>
            <input id="facebookAdsSpaceCampHQ" type="number" step="0.01" oninput="updateBudget()">
            <label>Instagram Ads (XODIA):</label>
            <input id="instagramAdsXodia" type="number" step="0.01" oninput="updateBudget()">
            <label>Instagram Ads (SPACE CAMP HQ):</label>
            <input id="instagramAdsSpaceCampHQ" type="number" step="0.01" oninput="updateBudget()">
            <label>Physical Flyers:</label>
            <input id="physicalFlyers" type="number" step="0.01" oninput="updateBudget()">
            <label>Eventbrite Ads:</label>
            <input id="eventbriteAds" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: STAFF
        -------------------------- -->
        <div class="collapsible" id="col_staff">
            <div class="collapsible-header" onclick="toggleCollapse('col_staff')">
            <span class="arrow">▸</span> Staff
            </div>
            <div class="collapsible-content">
            <label>Door Staff:</label>
            <input id="doorStaff" type="number" step="0.01" oninput="updateBudget()">
            <label>Merch Table:</label>
            <input id="merchTable" type="number" step="0.01" oninput="updateBudget()">
            <label>Transportation:</label>
            <input id="transportation" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: OTHER EXPENSES
        -------------------------- -->
        <div class="collapsible" id="col_otherexpenses">
            <div class="collapsible-header" onclick="toggleCollapse('col_otherexpenses')">
            <span class="arrow">▸</span> Other Expenses
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Other Expense Categories:</label>
                <input id="numOtherCategories" type="number" min="0" max="10" value="0"
                    onchange="regenerateOtherCategories()">
            </div>
            <div id="allOtherCategories"></div>
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: SALES
        -------------------------- -->
        <div class="collapsible" id="col_sales">
            <div class="collapsible-header" onclick="toggleCollapse('col_sales')">
            <span class="arrow">▸</span> Sales
            </div>
            <div class="collapsible-content">
            <label>Eventbrite Sales:</label>
            <input id="eventbriteSales" type="number" step="0.01" oninput="updateBudget()">
            <label>DJ Presales:</label>
            <input id="djPresales" type="number" step="0.01" oninput="updateBudget()">
            <label>Promo Team:</label>
            <input id="promoTeam" type="number" step="0.01" oninput="updateBudget()">
            <label>Door Sales:</label>
            <input id="doorSales" type="number" step="0.01" oninput="updateBudget()">
            <label>Merch Sold:</label>
            <input id="merchSold" type="number" step="0.01" oninput="updateBudget()">
            </div>
        </div>


        <!-- -------------------------
            COLLAPSIBLE: MERCH VENDORS
        -------------------------- -->
        <div class="collapsible" id="col_merchvendors">
            <div class="collapsible-header" onclick="toggleCollapse('col_merchvendors')">
            <span class="arrow">▸</span> Merch Vendors
            </div>
            <div class="collapsible-content">
            <div class="quantity-row">
                <label>Number of Merch Vendors:</label>
                <input id="numMerchVendors" type="number" min="0" max="10" value="0"
                    onchange="regenerateVendors()">
            </div>
            <div id="merchVendorInputs"></div>
            </div>
        </div>


        <!-- -------------------------
            ACTION BUTTONS
        -------------------------- -->
        <div class="action-buttons">
            <div class="button-row">
            <button type="button" onclick="downloadCSV()">Download CSV</button>
            <button type="button" onclick="downloadAll()">Download All</button>
            </div>
            <div class="button-row">
            <button type="button" onclick="triggerImport()">Import CSV</button>
            <button type="button" class="danger" onclick="resetForm()">Reset Form</button>
            </div>
            <input id="csvFileInput" type="file" accept=".csv" style="display: none">
        </div>
        </form>
    </div>


    <!-- =========================
        RIGHT COLUMN: CHARTS
    ========================== -->
    <aside class="charts-panel">
        <div class="chart-wrapper">
        <canvas id="expensesChart"></canvas>
        </div>
        <div class="chart-wrapper">
        <canvas id="salesChart"></canvas>
        </div>
    </aside>

    </div>
</div>

<!-- Scripts -->
<script type="module" src="js/main.js"></script>
<script type="module" src="js/uiHandlers.js"></script>

<script>
// Navigation toggle
document.addEventListener('DOMContentLoaded', () => {
    const navToggle = document.getElementById('navToggle');
    const navDropdown = document.getElementById('navDropdown');
    
    if (navToggle && navDropdown) {
        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('active');
        });
        
        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target)) {
                navDropdown.classList.remove('active');
            }
        });
    }
});

// Flyer preview functions
function handleFlyerPreview(input) {
    const preview = document.getElementById('flyerPreview');
    const image = document.getElementById('flyerImage');
    
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            image.src = e.target.result;
            preview.style.display = 'block';
        };
        
        reader.readAsDataURL(input.files[0]);
    }
}

function removeFlyerPreview() {
    const preview = document.getElementById('flyerPreview');
    const input = document.getElementById('flyerUpload');
    const image = document.getElementById('flyerImage');
    
    input.value = '';
    image.src = '';
    preview.style.display = 'none';
}

function viewFlyerFullSize() {
    const image = document.getElementById('flyerImage');
    if (image.src) {
        window.open(image.src, '_blank');
    }
}

// Make functions globally available
window.handleFlyerPreview = handleFlyerPreview;
window.removeFlyerPreview = removeFlyerPreview;
window.viewFlyerFullSize = viewFlyerFullSize;
</script>

</body>
</html>
